<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daniel Rebolleda — Powertrain Calibration Engineer</title>
<meta name="description" content="Daniel Rebolleda Hernández — hybrid powertrain calibration engineer. CV, about and portfolio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Oswald:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  /*VARS_START*/
  --bg:#151515;
  --bg2:#1a1a1a;
  --panel:#191919;
  --ink:#ECECEC;
  --muted:#8b8b8b;
  --faint:#5f5f5f;
  --line:#2b2b2b;
  --line2:#3d3d3d;
  /*VARS_END*/
  --head:"Oswald",sans-serif; --body:"Barlow Condensed",sans-serif; --mono:"Space Mono",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
::selection{background:#fff;color:#111}
.mono{font-family:var(--mono)}

/* ---------------- ENTRY ---------------- */
#entry{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;
  transition:opacity .5s ease,visibility .5s}
#entry.hide{opacity:0;visibility:hidden;pointer-events:none}
.entry-in{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 22px}
.stencil{font-family:var(--mono);font-size:11px;letter-spacing:.3em;color:var(--muted);margin-bottom:18px;text-transform:uppercase}
#entry h1{font-family:var(--head);font-weight:600;text-transform:uppercase;font-size:clamp(38px,8.4vw,72px);
  line-height:.94;letter-spacing:.01em;margin-bottom:12px}
.pick{font-family:var(--mono);font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--faint);
  display:flex;align-items:center;gap:14px;margin-bottom:24px}
.pick::before,.pick::after{content:"";height:1px;width:40px;background:var(--line)}
.flags{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:540px}
.flag{width:90px;background:none;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;
  gap:8px;padding:16px 0 12px;cursor:pointer;transition:.15s}
.flag:hover,.flag:focus-visible{border-color:var(--ink);transform:translateY(-3px);outline:none}
.flag .fg{display:block}
.flag .fg svg{display:block;width:36px;height:auto;border:1px solid var(--line2)}
.flag .fl{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em}
.flag:hover .fl{color:var(--ink)}
.entry-plate{font-family:var(--mono);font-size:10px;color:var(--faint);padding:22px;text-align:center;letter-spacing:.16em}

/* ---------------- SHELL ---------------- */
#app{min-height:100vh;display:flex;flex-direction:column;opacity:0;transition:opacity .5s ease .15s}
#app.on{opacity:1}
header{position:sticky;top:0;z-index:40;background:rgba(21,21,21,.72);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border-bottom:1px solid var(--line);transition:background .2s ease}
.hbar{max-width:960px;margin:0 auto;width:100%;padding:15px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.mark{font-family:var(--head);font-weight:600;font-size:15px;letter-spacing:.06em;cursor:pointer;white-space:nowrap;text-transform:uppercase}
.mark .dot{color:var(--muted)}
.hnav{display:flex;gap:22px}
.hnav button{font-family:var(--head);font-weight:500;font-size:14px;text-transform:uppercase;letter-spacing:.1em;
  background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);padding:5px 1px;cursor:pointer;transition:.15s}
.hnav button:hover{color:var(--ink)}
.hnav button.active{color:var(--ink);border-bottom-color:var(--ink)}
.hnav button:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
.hlang{position:relative}
.hlang>button{font-family:var(--mono);font-size:12px;color:var(--muted);background:none;border:1px solid var(--line);
  padding:7px 11px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:color .15s ease,border-color .15s ease}
.hlang>button:hover{color:var(--ink);border-color:var(--line2)}
.langmenu{position:absolute;right:0;top:calc(100% + 8px);background:rgba(26,26,26,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line2);
  min-width:150px;z-index:50;opacity:0;visibility:hidden;transform:translateY(-6px) scale(.98);transform-origin:top right;
  transition:opacity .18s ease,transform .18s ease,visibility .18s;pointer-events:none;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.langmenu.open{opacity:1;visibility:visible;transform:translateY(0) scale(1);pointer-events:auto}
.langmenu button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;
  color:var(--ink);font-family:var(--body);font-size:15px;padding:10px 14px;cursor:pointer;text-align:left;border-bottom:1px solid var(--line);transition:background .12s ease,padding-left .12s ease}
.langmenu button:last-child{border-bottom:none}
.langmenu button:hover{background:var(--panel);padding-left:18px}
.langmenu .fg{display:inline-flex}
.langmenu .fg svg{width:22px;height:auto;border:1px solid var(--line2)}
#langFlag{display:inline-flex;vertical-align:-4px}
#langFlag svg{width:18px;height:auto;border:1px solid var(--line2)}

main{flex:1;max-width:960px;margin:0 auto;width:100%;padding:0 24px}
.view{display:none;animation:fade .5s cubic-bezier(.16,.84,.44,1)}
.view.show{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#cv-xp>.xp-item,#cv-edu>.edu-item,.certs>.cert,#pf-grid>.pcard{animation:fadeUp .55s cubic-bezier(.16,.84,.44,1) backwards}
#cv-xp>.xp-item:nth-child(1),#cv-edu>.edu-item:nth-child(1),.certs>.cert:nth-child(1),#pf-grid>.pcard:nth-child(1){animation-delay:.04s}
#cv-xp>.xp-item:nth-child(2),#cv-edu>.edu-item:nth-child(2),.certs>.cert:nth-child(2),#pf-grid>.pcard:nth-child(2){animation-delay:.1s}
#cv-xp>.xp-item:nth-child(3),#cv-edu>.edu-item:nth-child(3),.certs>.cert:nth-child(3),#pf-grid>.pcard:nth-child(3){animation-delay:.16s}
#cv-edu>.edu-item:nth-child(4),.certs>.cert:nth-child(4){animation-delay:.22s}

.vtitle{padding-top:34px;font-family:var(--head);font-weight:600;font-size:clamp(30px,5.6vw,46px);text-transform:uppercase;
  line-height:1;margin:12px 0 34px;letter-spacing:.01em}

.eye{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
  display:flex;align-items:center;gap:12px;margin:44px 0 20px}
.eye .n{color:var(--faint)}
.eye::after{content:"";flex:1;height:1px;background:var(--line)}

/* ABOUT */
.lead{font-family:var(--head);font-weight:400;font-size:clamp(19px,3vw,25px);line-height:1.35;max-width:760px;margin-bottom:28px}
.about p{max-width:700px;color:#c9c9c9;margin-bottom:16px;font-size:18px}
.about p strong{color:var(--ink);font-weight:600}
.about p:empty{display:none;margin:0}
body.editing .about p:empty{display:block;min-height:1.4em;opacity:.4;border:1px dashed var(--line2)}

/* CV */
.logo-badge{width:46px;height:46px;flex:none;background:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;padding:6px}
.logo-badge img{max-width:100%;max-height:100%;object-fit:contain}
.xp-item{border-left:1px solid var(--line2);padding:0 0 32px 24px;margin-left:3px;position:relative}
.xp-item::before{content:"";position:absolute;left:-4px;top:8px;width:7px;height:7px;background:var(--ink)}
.xp-item:last-child{padding-bottom:0}
.xp-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:2px}
.xp-role{font-family:var(--head);font-weight:600;font-size:20px;text-transform:uppercase;line-height:1.1}
.xp-meta{font-family:var(--mono);font-size:12px;color:var(--muted);margin:6px 0 14px;display:flex;flex-wrap:wrap;gap:5px 16px}
.xp-meta .d{color:var(--ink)}
.xp-intro{color:#bdbdbd;font-size:17.5px;line-height:1.5;margin-bottom:14px;max-width:680px}
.xp-item ul{list-style:none;display:grid;gap:8px}
.xp-photos{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:flex-start}
.xp-photos img{height:280px;width:auto;max-width:100%;object-fit:contain;border:1px solid var(--line);filter:grayscale(.15) contrast(1.03)}
@media(max-width:560px){.xp-photos img{height:auto;width:100%}}
.xp-item li{position:relative;padding-left:18px;color:#c9c9c9}
.xp-item li::before{content:"–";position:absolute;left:0;color:var(--faint)}
.skills{display:grid;gap:22px}
.srow{border:none;padding:0}
.slabel{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.tags{display:block;color:#c9c9c9;font-size:17px;line-height:1.7}
.tag{font-family:var(--body);font-size:inherit;color:inherit;background:none;border:none;padding:0}
.tag+.tag::before{content:"  ·  ";color:var(--faint)}
.edu-item{display:grid;grid-template-columns:46px 1fr auto;gap:3px 16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.edu-item:last-child{border-bottom:none}
.edu-item .logo-badge{grid-row:1/3;align-self:start}
.edu-t{font-family:var(--head);font-weight:600;font-size:17px;text-transform:uppercase}
.edu-o{font-size:15px;color:var(--muted)}
.edu-d{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;text-align:right}
.edu-note{grid-column:2/-1;color:#bdbdbd;font-size:17.5px;margin-top:3px}
.edu-note:empty{display:none;margin:0}
body.editing .edu-note:empty{display:block;min-height:1.4em;opacity:.4;margin-top:3px}
.edu-note em{color:var(--ink);font-style:italic}
.certs{margin-top:18px;display:grid;gap:10px}
.cert{display:flex;gap:14px;align-items:center;color:#c9c9c9}
.cert .logo-badge{width:36px;height:36px;padding:5px}
.cert .k{font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap;min-width:74px;text-transform:uppercase}

/* PORTFOLIO */
.pgrid{display:grid;grid-template-columns:1fr;gap:16px}
.pcard{background:none;border:1px solid var(--line);padding:22px;display:flex;flex-direction:column;gap:13px;min-height:190px;transition:border-color .2s ease,transform .2s ease,box-shadow .2s ease}
.pcard:hover{border-color:var(--line2);transform:translateY(-3px);box-shadow:0 16px 32px rgba(0,0,0,.28)}
.pcard.ghost{border-style:dashed;opacity:.6;align-items:center;justify-content:center;text-align:center}
.ptop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pname{font-family:var(--head);font-weight:600;font-size:19px;text-transform:uppercase;line-height:1.05}
.ptag{font-family:var(--mono);font-size:10px;color:var(--muted);border:1px solid var(--line);padding:4px 8px;white-space:nowrap}
.pdesc{color:#bdbdbd;font-size:17.5px;flex:1}
.pstatus{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.plink{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);
  border:1px solid var(--line2);padding:8px 12px;display:inline-flex;align-items:center;gap:6px;align-self:flex-start;transition:border-color .15s ease,background .15s ease}
.plink:hover{border-color:var(--ink);background:rgba(255,255,255,.05)}
.pf-photos{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
.pf-photos img{width:calc(50% - 4px);min-width:140px;flex:1 1 160px;aspect-ratio:4/3;object-fit:contain;background:var(--panel);border:1px solid var(--line)}
.pcard.pentry{cursor:pointer}
.pbottom{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pchevron{font-family:var(--mono);color:var(--muted);transition:transform .25s ease;flex:none}
.pcard.open .pchevron{transform:rotate(180deg)}
.pdetail{display:flex;flex-direction:column;gap:12px;max-height:0;overflow:hidden;opacity:0;margin-top:0;padding-top:0;
  border-top:1px solid transparent;transition:max-height .38s ease,opacity .3s ease,margin-top .38s ease,padding-top .38s ease,border-color .38s ease}
.pcard.open .pdetail{opacity:1;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.pabstract{color:#c9c9c9;font-size:15px;line-height:1.6}

/* CONTACT */
.contact{margin:46px 0 10px;padding:26px 0 0;border-top:1px solid var(--line)}
.contact .ct{font-family:var(--head);font-weight:600;font-size:18px;text-transform:uppercase;margin-bottom:16px}
.crow{display:flex;flex-wrap:wrap;gap:12px}
.btn{font-family:var(--mono);font-size:13.5px;border:1px solid var(--line2);padding:11px 16px;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;background:none;color:var(--ink);transition:.15s}
.btn:hover{border-color:var(--ink)}
.btn.p{background:var(--ink);color:#111;border-color:var(--ink)}
.btn.p:hover{background:#fff}

footer{border-top:1px solid var(--line);margin-top:52px}
.foot{max-width:960px;margin:0 auto;padding:22px 24px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;
  font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.06em}

@media(max-width:560px){
  .hnav{gap:14px}.hnav button{font-size:12px}
  .edu-item{grid-template-columns:40px 1fr;gap:3px 12px}
  .edu-item .logo-badge{width:40px;height:40px}
  .edu-d{grid-column:2/-1;text-align:left;margin-top:2px}
  .edu-note{grid-column:2/-1}
  .hbar{padding:12px 16px}main{padding:0 16px}.mark{font-size:13px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

/* ---------------- EDIT MODE ---------------- */
body.editing [data-path]{outline:1px dashed #4a4a4a;outline-offset:2px;border-radius:2px;cursor:text}
body.editing [data-path]:hover{outline-color:#8b8b8b}
body.editing [data-path]:focus{outline:1px solid #ECECEC;background:rgba(255,255,255,.05)}

#editToolbar{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;align-items:center;gap:10px;
  background:rgba(25,25,25,.96);border:1px solid var(--line2);padding:10px 14px}
#editToolbar button{font-family:var(--mono);font-size:12px;background:none;border:1px solid var(--line2);color:var(--ink);
  padding:8px 12px;cursor:pointer;letter-spacing:.05em}
#editToolbar button:hover{border-color:var(--ink)}
#editToolbar button.on{background:var(--ink);color:#111;border-color:var(--ink)}
#saveStatus{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:76px}

.editbar{position:fixed;right:18px;bottom:70px;z-index:89;background:rgba(25,25,25,.96);border:1px solid var(--line2);
  padding:12px 14px;display:none;flex-direction:column;gap:8px;min-width:170px}
.editbar.show{display:flex}
.editbar label{font-family:var(--mono);font-size:11px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:10px}
.editbar input[type=color]{width:34px;height:22px;border:1px solid var(--line2);background:none;padding:0;cursor:pointer}

.ph-wrap{margin-bottom:22px}
.ph-wrap img{max-width:180px;display:block;border:1px solid var(--line)}
.ph-add{display:none;font-family:var(--mono);font-size:11px;color:var(--muted);border:1px dashed var(--line2);
  padding:14px 22px;background:none;cursor:pointer}
body.editing .ph-add{display:inline-flex}

.pthumb{width:100%;height:120px;object-fit:cover;border:1px solid var(--line);cursor:pointer}
.pthumb-add{display:none;font-family:var(--mono);font-size:10px;color:var(--muted);border:1px dashed var(--line2);
  padding:14px;text-align:center;cursor:pointer}
body.editing .pthumb-add{display:block}
</style>
</head>

const $=id=>document.getElementById(id);
let lang="en", view="cv";

function buildEntryFlags(){
  $("entryFlags").innerHTML=LANGS.map(([c,f,n])=>
    `<button class="flag" data-l="${c}" aria-label="${n}"><span class="fg">${FLAGS[c]}</span><span class="fl">${c.toUpperCase()}</span></button>`).join("");
  $("entryFlags").querySelectorAll(".flag").forEach(b=>
    b.addEventListener("click",()=>{lang=b.dataset.l;enter();}));
  $("langMenu").innerHTML=LANGS.map(([c,f,n])=>
    `<button data-l="${c}"><span class="fg">${FLAGS[c]}</span>${n}</button>`).join("");
  $("langMenu").querySelectorAll("button").forEach(b=>
    b.addEventListener("click",()=>{lang=b.dataset.l;$("langMenu").classList.remove("open");render();}));
}

function enter(){
  render();
  $("entry").classList.add("hide");
  $("app").classList.add("on");
  try{localStorage.setItem("lang",lang);}catch(e){}
}

}

let editMode=false, dirHandle=null, uploadTarget=null, saveTimer=null;

function getPath(obj,path){return path.split(".").reduce((o,k)=>o==null?o:o[k],obj);}
function setPath(obj,path,value){const keys=path.split(".");const last=keys.pop();const target=keys.reduce((o,k)=>o[k],obj);target[last]=value;}
function stripHtml(html){const d=document.createElement("div");d.innerHTML=html;return d.textContent;}

function applyEditMode(){
  document.querySelectorAll("[data-path]").forEach(el=>{el.contentEditable=editMode;});
}

async function ensureDirHandle(){
  if(dirHandle) return dirHandle;
  if(!window.showDirectoryPicker){ $("saveStatus").textContent="Navegador no compatible"; return null; }
  try{
    dirHandle=await window.showDirectoryPicker({mode:"readwrite"});
    $("saveStatus").textContent="Conectado ✓";
  }catch(e){ $("saveStatus").textContent="Sin acceso"; }
  return dirHandle;
}

function syncColorInputs(){
  const cs=getComputedStyle(document.documentElement);
  const get=v=>cs.getPropertyValue(v).trim();
  $("cVarBg").value=get("--bg")||"#151515";
  $("cVarInk").value=get("--ink")||"#ececec";
  $("cVarMuted").value=get("--muted")||"#8b8b8b";
  $("cVarPanel").value=get("--panel")||"#191919";
}

function scheduleSave(){
  $("saveStatus").textContent="Editando…";
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveAll,700);
}

async function saveAll(){
  if(!dirHandle){ $("saveStatus").textContent="Sin acceso a disco"; return; }
  try{
    $("saveStatus").textContent="Guardando…";
    const fh=await dirHandle.getFileHandle("index.html");
    const file=await fh.getFile();
    let text=await file.text();

    const cJson=JSON.stringify(C,null,1);
    text=text.replace(/\/\*C_START\*\/[\s\S]*?\/\*C_END\*\//,"/*C_START*/"+cJson+"/*C_END*/");

    const siteJson=JSON.stringify(SITE);
    text=text.replace(/\/\*SITE_START\*\/[\s\S]*?\/\*SITE_END\*\//,"/*SITE_START*/"+siteJson+"/*SITE_END*/");

    const cs=getComputedStyle(document.documentElement);
    const varLines=["--bg","--bg2","--panel","--ink","--muted","--faint","--line","--line2"]
      .map(v=>`  ${v}:${cs.getPropertyValue(v).trim()};`).join("\n");
    text=text.replace(/\/\*VARS_START\*\/[\s\S]*?\/\*VARS_END\*\//,"/*VARS_START*/\n"+varLines+"\n  /*VARS_END*/");

    const w=await fh.createWritable();
    await w.write(text);
    await w.close();
    $("saveStatus").textContent="Guardado ✓ "+new Date().toLocaleTimeString();
  }catch(err){
    console.error(err);
    $("saveStatus").textContent="Error al guardar";
  }
}

async function handleUpload(file){
  if(!file||!uploadTarget) return;
  const dh=await ensureDirHandle();
  if(!dh){ alert("No se pudo acceder a la carpeta del proyecto para guardar la imagen."); uploadTarget=null; return; }
  try{
    const imgDir=await dh.getDirectoryHandle("img",{create:true});
    const safeName=Date.now()+"_"+file.name.replace(/[^a-zA-Z0-9_.-]/g,"_");
    const fh=await imgDir.getFileHandle(safeName,{create:true});
    const w=await fh.createWritable();
    await w.write(file);
    await w.close();
    const relPath="img/"+safeName;
    if(uploadTarget.type==="photo"){
      SITE.photo=relPath;
      renderPhoto();
    }else if(uploadTarget.type==="port"){
      Object.values(C).forEach(langObj=>{
        const item=langObj.port&&langObj.port[uploadTarget.idx];
        if(item&&!item.ghost) item.img=relPath;
      });
      render();
    }
    await saveAll();
  }catch(err){
    console.error(err);
    $("saveStatus").textContent="Error al subir imagen";
  }
  uploadTarget=null;
}

function show(v){
  view=v;
  document.querySelectorAll(".view").forEach(s=>s.classList.remove("show"));
  $("view-"+v).classList.add("show");
  [...$("nav").children].forEach(b=>b.classList.toggle("active",b.dataset.view===v));
  window.scrollTo({top:0,behavior:"instant"in window?"instant":"auto"});
}

$("nav").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>show(b.dataset.view)));
$("goHome").addEventListener("click",()=>show("cv"));
$("langBtn").addEventListener("click",e=>{e.stopPropagation();$("langMenu").classList.toggle("open");});
document.addEventListener("click",()=>$("langMenu").classList.remove("open"));

// Edit mode wiring
if(!/^(localhost|127\.0\.0\.1)$/.test(location.hostname)){ $("editToolbar").style.display="none"; }

$("editToggle").addEventListener("click",async()=>{
  editMode=!editMode;
  document.body.classList.toggle("editing",editMode);
  $("editToggle").classList.toggle("on",editMode);
  $("editbar").classList.toggle("show",editMode);
  applyEditMode();
  if(editMode){
    if(!dirHandle) await ensureDirHandle();
    syncColorInputs();
  }
});

document.addEventListener("blur",e=>{
  if(!editMode) return;
  const el=e.target;
  if(!el.getAttribute) return;
  const path=el.getAttribute("data-path");
  if(!path) return;
  const newVal=el.textContent;
  const oldVal=getPath(C[lang],path);
  const oldPlain=typeof oldVal==="string"?stripHtml(oldVal):oldVal;
  if(newVal===oldPlain) return;
  setPath(C[lang],path,newVal);
  scheduleSave();
},true);

document.addEventListener("keydown",e=>{
  if(!editMode) return;
  if(e.key==="Enter"&&e.target.hasAttribute&&e.target.hasAttribute("data-path")){
    e.preventDefault();
    e.target.blur();
  }
});

[["cVarBg","--bg"],["cVarInk","--ink"],["cVarMuted","--muted"],["cVarPanel","--panel"]].forEach(([id,varName])=>{
  $(id).addEventListener("input",()=>document.documentElement.style.setProperty(varName,$(id).value));
  $(id).addEventListener("change",()=>scheduleSave());
});

$("ab-photo-btn").addEventListener("click",()=>{
  if(!editMode) return;
  uploadTarget={type:"photo"};
  $("fileInput").click();
});

$("pf-grid").addEventListener("click",e=>{
  const t=e.target.closest("[data-pidx]");
  if(t&&editMode){
    uploadTarget={type:"port",idx:Number(t.dataset.pidx)};
    $("fileInput").click();
    return;
  }
  if(editMode||e.target.closest("a")) return;
  const card=e.target.closest(".pentry");
  if(!card) return;
  const detail=card.querySelector(".pdetail");
  if(card.classList.contains("open")){
    detail.style.maxHeight=detail.scrollHeight+"px";
    detail.getBoundingClientRect();
    detail.style.maxHeight="0px";
    card.classList.remove("open");
  }else{
    card.classList.add("open");
    detail.style.maxHeight=detail.scrollHeight+"px";
    detail.addEventListener("transitionend",function h(ev){
      if(ev.propertyName!=="max-height")return;
      if(card.classList.contains("open"))detail.style.maxHeight="none";
      detail.removeEventListener("transitionend",h);
    });
  }
});

$("fileInput").addEventListener("change",e=>{
  const file=e.target.files[0];
  e.target.value="";
  handleUpload(file);
});

buildEntryFlags();
try{
  const nav=(navigator.language||"en").slice(0,2);
  if(C[nav])lang=nav;
  const saved=localStorage.getItem("lang");
  if(saved&&C[saved])lang=saved;
}catch(e){}
render();
</script>
</body>
</html>
